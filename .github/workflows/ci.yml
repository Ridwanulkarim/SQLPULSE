name: SQLPulse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (Clean CI)
        run: npm ci

      - name: Build core workspace package
        run: npm run build:core

      - name: Typecheck backend
        run: npx tsc -p backend/tsconfig.json --noEmit

      - name: Typecheck frontend
        run: npx tsc -p frontend/tsconfig.json --noEmit

      - name: Run automated test suite
        run: npm test

      - name: Build backend TypeScript
        run: npm run build:backend

      - name: Build frontend bundle
        run: npm run build:frontend

      - name: Smoke test backend health check
        run: |
          node backend/dist/server.js &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:4000/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID

